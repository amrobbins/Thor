[build-system]
requires = [
    "scikit-build-core>=0.11.6",
    "cmake>=3.28",
    "ninja",
]
build-backend = "thor_kernel_build_backend"
backend-path = ["build_backend"]

[project]
name = "thor-cuda-kernels-sm120"
dynamic = ["version"]
description = "Thor CUDA native backend for NVIDIA sm_120 GPUs"
requires-python = ">=3.12"
license = "Apache-2.0"
readme = { text = "Architecture-specific CUDA backend for `thor-cuda`. This package is installed automatically by `thor-cuda` and is not intended to be used directly.", content-type = "text/markdown" }

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/amrobbins/Thor"
Repository = "https://github.com/amrobbins/Thor"
"Bug Tracker" = "https://github.com/amrobbins/Thor/issues"

[tool.scikit-build]
experimental = true
cmake.source-dir = "../../../.."
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
build.targets = ["Thor"]
install.components = ["thor_cuda_kernel_backend"]
wheel.packages = []
wheel.py-api = "py3"

[tool.scikit-build.cmake.define]
THOR_PYTHON_WHEEL_ARTIFACT = "thor-cuda-kernels-sm120"

[tool.scikit-build.metadata.version]
provider = "thor_build.version_metadata"
